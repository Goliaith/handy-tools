<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Task Board • Handy Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .kanban-column {
            min-height: 400px;
        }
        .task-card {
            transition: all 0.2s ease;
        }
        .task-card:hover {
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .task-card.dragging {
            opacity: 0.5;
        }
        .drop-zone {
            min-height: 50px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="max-w-screen-xl mx-auto">
        <!-- Header -->
        <div class="px-8 pt-6 pb-4 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-x-4">
                <a href="../index.html" class="flex items-center gap-x-2 text-slate-400 hover:text-white text-sm">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Portfolio</span>
                </a>
                <div>
                    <h1 class="font-semibold text-2xl">Kanban Task Board</h1>
                    <p class="text-sm text-slate-400">Drag and drop to manage your tasks</p>
                </div>
            </div>
            <div class="flex gap-x-2">
                <button onclick="addTask()" class="px-4 py-2 bg-white text-slate-900 font-semibold text-sm rounded-2xl flex items-center gap-x-2">
                    <i class="fa-solid fa-plus"></i> <span>Add Task</span>
                </button>
                <button onclick="clearBoard()" class="px-4 py-2 text-sm font-medium bg-red-900/20 hover:bg-red-900/40 text-red-400 rounded-2xl">
                    <i class="fa-solid fa-trash"></i> <span>Clear All</span>
                </button>
            </div>
        </div>

        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- To Do Column -->
                <div class="kanban-column bg-slate-900 border border-slate-800 rounded-3xl p-4" 
                     ondrop="drop(event)" ondragover="allowDrop(event)" data-status="todo">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-x-2">
                            <div class="w-3 h-3 bg-slate-400 rounded-full"></div>
                            <h3 class="font-semibold">To Do</h3>
                        </div>
                        <span id="todo-count" class="text-xs px-2 py-0.5 bg-slate-800 rounded-full">0</span>
                    </div>
                    <div id="todo" class="space-y-3 min-h-[300px] drop-zone"></div>
                </div>

                <!-- In Progress Column -->
                <div class="kanban-column bg-slate-900 border border-slate-800 rounded-3xl p-4" 
                     ondrop="drop(event)" ondragover="allowDrop(event)" data-status="inprogress">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-x-2">
                            <div class="w-3 h-3 bg-yellow-400 rounded-full"></div>
                            <h3 class="font-semibold">In Progress</h3>
                        </div>
                        <span id="inprogress-count" class="text-xs px-2 py-0.5 bg-slate-800 rounded-full">0</span>
                    </div>
                    <div id="inprogress" class="space-y-3 min-h-[300px] drop-zone"></div>
                </div>

                <!-- Done Column -->
                <div class="kanban-column bg-slate-900 border border-slate-800 rounded-3xl p-4" 
                     ondrop="drop(event)" ondragover="allowDrop(event)" data-status="done">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-x-2">
                            <div class="w-3 h-3 bg-emerald-400 rounded-full"></div>
                            <h3 class="font-semibold">Done</h3>
                        </div>
                        <span id="done-count" class="text-xs px-2 py-0.5 bg-slate-800 rounded-full">0</span>
                    </div>
                    <div id="done" class="space-y-3 min-h-[300px] drop-zone"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="task-modal" onclick="if (event.target.id === 'task-modal') hideTaskModal()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div onclick="event.stopImmediatePropagation()" class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-3xl p-6">
            <h3 id="modal-title" class="font-semibold text-xl mb-4">Add Task</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-400">Task Title</label>
                    <input id="task-title" type="text" class="w-full bg-slate-950 border border-slate-700 px-4 py-2.5 rounded-2xl mt-1 focus:outline-none focus:border-indigo-500" placeholder="What needs to be done?">
                </div>
                <div>
                    <label class="text-xs text-slate-400">Description (optional)</label>
                    <textarea id="task-desc" class="w-full bg-slate-950 border border-slate-700 px-4 py-2.5 rounded-2xl h-20 mt-1 focus:outline-none focus:border-indigo-500" placeholder="Details..."></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-slate-400">Priority</label>
                        <select id="task-priority" class="w-full bg-slate-950 border border-slate-700 px-4 py-2.5 rounded-2xl mt-1 focus:outline-none focus:border-indigo-500">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Due Date (optional)</label>
                        <input id="task-due" type="date" class="w-full bg-slate-950 border border-slate-700 px-4 py-2.5 rounded-2xl mt-1 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <div class="mt-6 flex gap-x-3">
                <button onclick="saveTask()" class="flex-1 py-2.5 bg-white text-slate-900 font-semibold rounded-2xl">Save Task</button>
                <button onclick="hideTaskModal()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 font-semibold rounded-2xl">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let tasks = [];
        let editingTaskId = null;

        function loadData() {
            const saved = localStorage.getItem('kanban_tasks');
            if (saved) {
                tasks = JSON.parse(saved);
            } else {
                // Sample data
                tasks = [
                    { id: 't1', title: 'Research competitors', desc: 'Look at top 5 tools in the space', priority: 'high', due: '2025-02-15', status: 'todo' },
                    { id: 't2', title: 'Design landing page', desc: '', priority: 'medium', due: '2025-02-20', status: 'inprogress' },
                    { id: 't3', title: 'Set up analytics', desc: 'Google Analytics + custom events', priority: 'low', due: '', status: 'done' }
                ];
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('kanban_tasks', JSON.stringify(tasks));
            renderBoard();
        }

        function renderBoard() {
            const columns = {
                todo: document.getElementById('todo'),
                inprogress: document.getElementById('inprogress'),
                done: document.getElementById('done')
            };

            // Clear columns
            Object.values(columns).forEach(col => col.innerHTML = '');

            const counts = { todo: 0, inprogress: 0, done: 0 };

            tasks.forEach(task => {
                const card = createTaskCard(task);
                columns[task.status].appendChild(card);
                counts[task.status]++;
            });

            // Update counts
            document.getElementById('todo-count').textContent = counts.todo;
            document.getElementById('inprogress-count').textContent = counts.inprogress;
            document.getElementById('done-count').textContent = counts.done;
        }

        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = `task-card bg-slate-950 border border-slate-700 rounded-2xl p-3 cursor-move ${task.priority === 'high' ? 'border-red-500/50' : task.priority === 'low' ? 'border-green-500/50' : ''}`;
            card.draggable = true;
            card.dataset.id = task.id;
            card.ondragstart = drag;

            let priorityColor = task.priority === 'high' ? 'text-red-400' : task.priority === 'low' ? 'text-green-400' : 'text-yellow-400';
            let dueHtml = task.due ? `<div class="text-[10px] text-slate-500 mt-1"><i class="fa-solid fa-calendar mr-1"></i>${task.due}</div>` : '';

            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="font-medium text-sm flex-1">${task.title}</div>
                    <div class="flex gap-x-1 ml-2">
                        <button onclick="editTask('${task.id}', event)" class="text-slate-400 hover:text-white text-xs p-0.5"><i class="fa-solid fa-edit"></i></button>
                        <button onclick="deleteTask('${task.id}', event)" class="text-red-400 hover:text-red-300 text-xs p-0.5"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
                ${task.desc ? `<div class="text-xs text-slate-400 mt-1 line-clamp-2">${task.desc}</div>` : ''}
                <div class="flex items-center justify-between mt-2">
                    <span class="text-[10px] px-2 py-0.5 rounded ${priorityColor} bg-slate-800">${task.priority}</span>
                    ${dueHtml}
                </div>
            `;

            return card;
        }

        function addTask() {
            document.getElementById('modal-title').textContent = 'Add New Task';
            document.getElementById('task-title').value = '';
            document.getElementById('task-desc').value = '';
            document.getElementById('task-priority').value = 'medium';
            document.getElementById('task-due').value = '';
            editingTaskId = null;
            document.getElementById('task-modal').classList.remove('hidden');
            document.getElementById('task-modal').classList.add('flex');
        }

        function editTask(id, e) {
            e.stopImmediatePropagation();
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            editingTaskId = id;
            document.getElementById('modal-title').textContent = 'Edit Task';
            document.getElementById('task-title').value = task.title;
            document.getElementById('task-desc').value = task.desc || '';
            document.getElementById('task-priority').value = task.priority;
            document.getElementById('task-due').value = task.due || '';
            document.getElementById('task-modal').classList.remove('hidden');
            document.getElementById('task-modal').classList.add('flex');
        }

        function saveTask() {
            const title = document.getElementById('task-title').value.trim();
            if (!title) {
                alert('Task title is required');
                return;
            }

            const taskData = {
                title: title,
                desc: document.getElementById('task-desc').value.trim(),
                priority: document.getElementById('task-priority').value,
                due: document.getElementById('task-due').value,
                status: editingTaskId ? tasks.find(t => t.id === editingTaskId).status : 'todo'
            };

            if (editingTaskId) {
                const index = tasks.findIndex(t => t.id === editingTaskId);
                tasks[index] = { ...tasks[index], ...taskData };
            } else {
                tasks.push({
                    id: 't' + Date.now(),
                    ...taskData
                });
            }

            saveData();
            hideTaskModal();
        }

        function deleteTask(id, e) {
            e.stopImmediatePropagation();
            if (confirm('Delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveData();
            }
        }

        function hideTaskModal() {
            document.getElementById('task-modal').classList.remove('flex');
            document.getElementById('task-modal').classList.add('hidden');
        }

        // Drag and Drop
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.dataset.id);
            ev.target.classList.add('dragging');
        }

        function drop(ev) {
            ev.preventDefault();
            const taskId = ev.dataTransfer.getData("text");
            const newStatus = ev.currentTarget.dataset.status;
            
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.status = newStatus;
                saveData();
            }
            
            // Remove dragging class
            document.querySelectorAll('.task-card').forEach(c => c.classList.remove('dragging'));
        }

        function clearBoard() {
            if (confirm('Clear all tasks?')) {
                tasks = [];
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('kanban_tasks', JSON.stringify(tasks));
            renderBoard();
        }

        function renderBoard() {
            const columns = {
                todo: document.getElementById('todo'),
                inprogress: document.getElementById('inprogress'),
                done: document.getElementById('done')
            };

            Object.values(columns).forEach(col => col.innerHTML = '');

            const counts = { todo: 0, inprogress: 0, done: 0 };

            tasks.forEach(task => {
                const card = createTaskCard(task);
                columns[task.status].appendChild(card);
                counts[task.status]++;
            });

            document.getElementById('todo-count').textContent = counts.todo;
            document.getElementById('inprogress-count').textContent = counts.inprogress;
            document.getElementById('done-count').textContent = counts.done;
        }

        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = `task-card bg-slate-950 border border-slate-700 rounded-2xl p-3 cursor-grab ${task.priority === 'high' ? 'border-red-500/50' : task.priority === 'low' ? 'border-green-500/50' : ''}`;
            card.draggable = true;
            card.dataset.id = task.id;
            card.ondragstart = drag;

            let priorityColor = task.priority === 'high' ? 'text-red-400' : task.priority === 'low' ? 'text-green-400' : 'text-yellow-400';
            let dueHtml = task.due ? `<div class="text-[10px] text-slate-500 mt-1"><i class="fa-solid fa-calendar mr-1"></i>${task.due}</div>` : '';

            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="font-medium text-sm flex-1 pr-2">${task.title}</div>
                    <div class="flex gap-x-1 ml-1">
                        <button onclick="editTask('${task.id}', event)" class="text-slate-400 hover:text-white text-xs p-0.5"><i class="fa-solid fa-edit"></i></button>
                        <button onclick="deleteTask('${task.id}', event)" class="text-red-400 hover:text-red-300 text-xs p-0.5"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
                ${task.desc ? `<div class="text-xs text-slate-400 mt-1 line-clamp-2">${task.desc}</div>` : ''}
                <div class="flex items-center justify-between mt-2">
                    <span class="text-[10px] px-2 py-0.5 rounded ${priorityColor} bg-slate-800">${task.priority}</span>
                    ${dueHtml}
                </div>
            `;

            return card;
        }

        function init() {
            loadData();
            renderBoard();
            console.log('%c[Kanban Task Board] Tool ready. Drag tasks between columns.', 'color:#64748b');
        }

        window.onload = init;
    </script>
</body>
</html>
